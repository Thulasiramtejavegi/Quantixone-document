name: Rollback Documentation

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Version to rollback to (e.g., commit SHA or "HEAD~1" for previous)'
        required: true
        type: string
      reason:
        description: 'Reason for rollback (for logging)'
        required: false
        type: string
        default: 'Manual rollback'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install mkdocs-material
          pip install mike

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages

      - name: Rollback Deployment
        run: |
          echo "🔄 Rolling back to: ${{ github.event.inputs.target_version }}"
          
          git checkout gh-pages
          
          # Handle different rollback targets
          TARGET="${{ github.event.inputs.target_version }}"
          
          if [[ "$TARGET" == "HEAD~"* ]]; then
            # Rollback by number of commits (e.g., HEAD~1)
            git reset --hard $TARGET
          else
            # Rollback to specific commit SHA
            git reset --hard $TARGET
          fi
          
          git push origin gh-pages --force
          
          echo "✅ Successfully rolled back to $TARGET"

      - name: Log Rollback
        run: |
          echo "## 🔄 Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ${{ github.event.inputs.target_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason:** ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Rollback completed successfully!" >> $GITHUB_STEP_SUMMARY

      - name: Notify
        run: |
          echo "🔔 Rollback completed!"
          echo "Target: ${{ github.event.inputs.target_version }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Check your site: https://${{ github.repository_owner }}.github.io/Quantixone-document/"
